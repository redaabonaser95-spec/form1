<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
</head>

<body>

    <header>

        <h1>تسجيل الدخول</h1>

        <nav>
            <a href="login.html">تسجيل الدخول</a>
            <a href="register.html">إنشاء حساب</a>
            <a href="contact.html">تواصل معنا</a>
        </nav>

    </header>

    <hr>

    <main>

        <section>

            <h2>أدخل بيانات تسجيل الدخول</h2>

            <form action="login.html" method="post">

                <label for="username">اسم المستخدم:</label>

                <input type="text"
                       id="username"
                       name="username"
                       required>

                <br><br>

                <label for="password">كلمة المرور:</label>

                <input type="password"
                       id="password"
                       name="password"
                       required>

                <br><br>

                <button type="submit">Login</button>

            </form>

            <p>
                ليس لديك حساب؟
                <a href="register.html">إنشاء حساب جديد</a>
            </p>

        </section>

    </main>

    <hr>

    <footer>
        <p>جميع الحقوق محفوظة.</p>
    </footer>

</body>
</html>
