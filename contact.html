<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تواصل معنا</title>
</head>

<body>

    <header>

        <h1>تواصل معنا</h1>

        <nav>
            <a href="login.html">تسجيل الدخول</a>
            <a href="register.html">إنشاء حساب</a>
            <a href="contact.html">تواصل معنا</a>
        </nav>

    </header>

    <hr>

    <main>

        <section>

            <h2>أرسل رسالتك أو استفسارك</h2>

            <p>
                نموذج لجمع آراء المستخدمين أو استفساراتهم.
            </p>

            <form action="contact.html"
                  method="post"
                  enctype="multipart/form-data">

                <label for="subject">موضوع الرسالة:</label>

                <input type="text"
                       id="subject"
                       name="subject"
                       required>

                <br><br>

                <label for="message">نص الرسالة:</label>

                <br>

                <textarea id="message"
                          name="message"
                          rows="6"
                          cols="40"
                          required></textarea>

                <br><br>

                <label for="attachment">إرفاق صورة أو ملف:</label>

                <input type="file"
                       id="attachment"
                       name="attachment">

                <br><br>

                <button type="submit">Send</button>

            </form>

        </section>

    </main>

    <hr>

    <footer>
        <p>جميع الحقوق محفوظة.</p>
    </footer>

</body>
</html>
